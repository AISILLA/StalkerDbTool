              fun decompressLzo1xSafe(src: ByteArray, maxDestSize: Int): ByteArray {
                  val out = ByteArray(maxDestSize)
                  var ip = 0
                  var op = 0
                  var t = 0

                  fun copyMatch(mPosStart: Int, count: Int) {
                      var m = mPosStart
                      for (k in 0 until count) {
                          if (op < out.size && m >= 0 && m < op) {
                              out[op++] = out[m++]
                          }
                      }
