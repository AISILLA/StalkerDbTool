name: Build Stalker DB APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Android project structure
        run: |
          mkdir -p app/src/main/java/com/stalker/dbtool
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cp MainActivity.kt app/src/main/java/com/stalker/dbtool/MainActivity.kt

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StalkerDbTool"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.stalker.dbtool"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.stalker.dbtool"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.activity:activity-ktx:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          # Фон иконки (Тёмный графит Зоны с металлическим оттенком)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1A1C18"
                  android:pathData="M0,0h108v108h-108z" />
              <!-- Окружность радара КПК -->
              <path
                  android:strokeColor="#2F382B"
                  android:strokeWidth="1.5"
                  android:pathData="M54,14 A40,40 0 1,1 53.9,14 Z" />
              <path
                  android:strokeColor="#252C22"
                  android:strokeWidth="1"
                  android:pathData="M54,26 A28,28 0 1,1 53.9,26 Z" />
          </vector>
          EOF

          # Передний план иконки (Золотисто-янтарный знак радиации S.T.A.L.K.E.R.)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Центральный круг -->
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M54,49 A5,5 0 1,1 53.9,49 Z" />
              <!-- Верхний лепесток -->
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M44.5,37.5 L36.2,23.2 A32,32 0 0,1 71.8,23.2 L63.5,37.5 A16,16 0 0,0 44.5,37.5 Z" />
              <!-- Правый нижний лепесток -->
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M65.0,55.0 L81.5,55.0 A32,32 0 0,1 63.7,85.8 L55.4,71.5 A16,16 0 0,0 65.0,55.0 Z" />
              <!-- Левый нижний лепесток -->
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M43.0,55.0 L52.6,71.5 A16,16 0 0,0 44.3,85.8 A32,32 0 0,1 26.5,55.0 Z" />
              <!-- Рамочный акцент базы данных/архива -->
              <path
                  android:strokeColor="#10B981"
                  android:strokeWidth="1.5"
                  android:pathData="M30,86 L78,86" />
          </vector>
          EOF

          # Адаптивный манифест иконки
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission
                  android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />

              <application
                  android:allowBackup="true"
                  android:label="STALKER DB Tool"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: stalker-db-tool-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
