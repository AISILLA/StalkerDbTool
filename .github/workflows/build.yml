              fun decodeHeader(rawChunk: ByteArray): ByteArray {
                  val attempts = mutableListOf<ByteArray>()
                  attempts.add(decryptGsc(rawChunk, 0x131a9d3L, 20042299L, 0x0518443bL))
                  attempts.add(decryptGsc(rawChunk, 0x01622731L, 25178309L, 0x0198812dL))
                  attempts.add(rawChunk)

                  for (buf in attempts) {
                      if (buf.size >= 9 && (buf[0].toInt() and 0xFF) == 0xC8) {
