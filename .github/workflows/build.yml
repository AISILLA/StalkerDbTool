                  val dLen = IntArray(256) { idx ->
                      when {
                          idx < 0x20 -> 3
                          idx < 0x50 -> 4
                          idx < 0x90 -> 5
                          idx < 0xC0 -> 6
                          idx < 0xF0 -> 7
                          else -> 8
                      }
                  }

                  fun decodeChar(): Int {
                      var c = son[R]
                      while (c < T) {
                          c += getBit()
                          c = son[c]
                      }
                      c -= T
                      update(c)
                      return c
                  }

                  fun decodePosition(): Int {
                      val i = getByte()
                      val c = dCode[i] shl 6
                      var j = dLen[i] - 2
                      var rem = i
                      while (j-- > 0) {
                          rem = (rem shl 1) + getBit()
                      }
                      return c or (rem and 0x3F)
                  }

                  val N_DICT = 4096
                  val F_DICT = 60
                  val THRESHOLD = 2
                  val textBuf = ByteArray(N_DICT + F_DICT - 1) { 0x20 }
                  var rDict = N_DICT - F_DICT

