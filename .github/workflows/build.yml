                          idx < 0x90 -> 4 + ((idx - 0x50) ushr 3)
                          idx < 0xC0 -> 12 + ((idx - 0x90) ushr 2)
                          idx < 0xF0 -> 24 + ((idx - 0xC0) ushr 1)
                          else -> 48 + (idx - 0xF0)
                      }
