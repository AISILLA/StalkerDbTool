              fun parseEntries(b: ByteArray): List<DbFileEntry> {
                  val list = mutableListOf<DbFileEntry>()
                  if (b.size < 20) return list
                  val buf = ByteBuffer.wrap(b).order(ByteOrder.LITTLE_ENDIAN)

                  while (buf.remaining() >= 18) {
