                  val invSbox = IntArray(256)
                  for (i in 0..255) {
                      invSbox[sbox[i]] = i
                  }

                  val dst = ByteArray(src.size)
                  var s = seed
                  for (i in src.indices) {
                      s = (s * mult + add) and 0xFFFFFFFFL
                      val key = ((s ushr 24) and 0xFFL).toInt()
                      val raw = src[i].toInt() and 0xFF
                      dst[i] = (invSbox[raw] xor key).toByte()
                  }
                  return dst
