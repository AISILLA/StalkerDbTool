                      if (entrySize < 16 || buf.remaining() < (entrySize - 2)) break

                      val sizeReal = buf.int.toLong() and 0xFFFFFFFFL
                      val sizeComp = buf.int.toLong() and 0xFFFFFFFFL
                      val crc = buf.int.toLong() and 0xFFFFFFFFL
                      val remaining = entrySize - 14

                      val candOffset = buf.int.toLong() and 0xFFFFFFFFL
                      val path: String
                      val offset: Long

                      if (candOffset >= 0L && remaining > 4 && buf.remaining() >= remaining - 4) {
